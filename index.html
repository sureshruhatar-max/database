<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ડેટાબેઝ - શોધ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-section {
            max-width: 700px;
            margin: 0 auto 30px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .search-section label {
            display: block;
            font-weight: bold;
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 10px;
        }
        .search-section .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-section input {
            flex: 1;
            padding: 15px 20px;
            border: 3px solid #667eea;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            min-width: 200px;
            text-align: center;
            transition: 0.3s;
        }
        .search-section input:focus {
            outline: none;
            border-color: #5a67d8;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.2);
        }
        .search-section .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a67d8; transform: translateY(-2px); }
        .btn-secondary { background: #718096; color: white; }
        .btn-secondary:hover { background: #4a5568; transform: translateY(-2px); }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            display: none;
        }
        .status.success { display: block; background: #c6f6d5; color: #22543d; }
        .status.error { display: block; background: #fed7d7; color: #742a2a; }
        .status.info { display: block; background: #bee3f8; color: #2a69ac; }

        /* ========== ડિટેલ કાર્ડ ========== */
        .detail-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .detail-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border-top: 8px solid #667eea;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 3px solid #f0f0f0;
            margin-bottom: 25px;
        }
        .detail-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 34px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .detail-header-info {
            flex: 1;
        }
        .detail-header-info h2 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .detail-header-info .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }
        .badge-rank { background: #667eea; }
        .badge-id { background: #ed8936; }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .detail-field {
            background: #f7fafc;
            padding: 14px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .detail-field .field-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .detail-field .field-value {
            font-size: 16px;
            color: #2d3748;
            font-weight: 600;
            word-break: break-word;
        }
        .detail-field.full {
            grid-column: 1 / -1;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }
        .detail-actions button {
            flex: 1;
            min-width: 140px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-warning { background: #ed8936; color: white; }
        .btn-warning:hover { background: #dd6b20; transform: translateY(-2px); }
        .btn-success { background: #48bb78; color: white; }
        .btn-success:hover { background: #38a169; transform: translateY(-2px); }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }
        .empty-state .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .empty-state p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* ========== એડિટ ફોર્મ ========== */
        .edit-form {
            display: none;
        }
        .edit-form.active {
            display: block;
        }
        .edit-form .form-group {
            margin-bottom: 15px;
        }
        .edit-form label {
            display: block;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .edit-form input,
        .edit-form select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
        }
        .edit-form input:focus,
        .edit-form select:focus {
            outline: none;
            border-color: #667eea;
        }
        .edit-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 22px; }
            .search-section { padding: 20px; }
            .search-section label { font-size: 16px; }
            .search-section input { font-size: 16px; padding: 12px; }
            .search-section .btn { width: 100%; font-size: 16px; padding: 12px; }
            .detail-card { padding: 20px; }
            .detail-header { flex-direction: column; text-align: center; }
            .detail-header-info .badges { justify-content: center; }
            .detail-avatar { width: 70px; height: 70px; font-size: 28px; }
            .detail-header-info h2 { font-size: 20px; }
            .detail-grid { grid-template-columns: 1fr; }
            .detail-field .field-value { font-size: 15px; }
            .edit-form .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>B કંપની</h1>
    </div>

    <!-- શોધ બોક્સ -->
    <div class="search-section">
        <label for="searchInput">🔢 બકલ નંબર નાખો:</label>
        <div class="search-row">
            <input type="number" id="searchInput" placeholder="દા.ત. 1" autofocus>
            <button class="btn btn-primary" onclick="searchPerson()">🔍 શોધો</button>
            <button class="btn btn-secondary" onclick="resetSearch()">🔄 રીસેટ</button>
        </div>
        <div class="status" id="statusMsg"></div>
    </div>

    <!-- ડિટેલ વ્યૂ -->
    <div class="detail-container" id="detailContainer">
        <div class="empty-state">
            <div class="icon">🔍</div>
            <h3>બકલ નંબર નાખો</h3>
            <p>ઉપર બોક્સમાં બકલ નંબર નાખીને શોધો બટન દબાવો</p>
        </div>
    </div>

<script>
// ========== CONFIGURATION ==========
const API_URL = 'https://script.google.com/macros/s/AKfycbzpUfQ8JKSKfMFDmx77wgerNXOAdea1BII0L36czVSr1zhEEC2IXSOMPgoADUc8jDe9VQ/exec';

let peopleData = [];
let currentId = null;

// ========== API CALLS ==========
async function callAPI() {
    try {
        const response = await fetch(API_URL, { method: 'GET', mode: 'cors' });
        const result = await response.json();
        return result;
    } catch (error) {
        console.error('API Error:', error);
        return { error: error.message };
    }
}

// ========== LOAD ALL DATA ==========
async function loadAllData() {
    showStatus('⏳ ડેટા લોડ થઈ રહ્યો છે...', 'info');
    const result = await callAPI();
    if (Array.isArray(result)) {
        peopleData = result;
        showStatus('✅ ' + peopleData.length + ' રેકોર્ડ્સ લોડ થયા', 'success');
        setTimeout(() => hideStatus(), 2000);
    } else {
        showStatus('❌ ડેટા લોડ કરવામાં ભૂલ: ' + (result.error || 'Unknown error'), 'error');
    }
}

// ========== SEARCH PERSON ==========
function searchPerson() {
    const query = document.getElementById('searchInput').value.trim();
    
    if (!query) {
        showStatus('❌ કૃપા કરીને બકલ નંબર નાખો!', 'error');
        return;
    }
    
    // ID થી શોધો
    const person = peopleData.find(p => String(p.ID) === String(query));
    
    if (!person) {
        showStatus('❌ બકલ નંબર ' + query + ' મળ્યો નહીં!', 'error');
        showEmptyState('❌', 'બકલ નંબર મળ્યો નહીં', 'બીજો બકલ નંબર ટ્રાય કરો');
        return;
    }
    
    currentId = person.ID;
    showStatus('✅ બકલ નંબર ' + query + ' નો ડેટા મળ્યો!', 'success');
    showDetailView(person);
}

// ========== SHOW DETAIL VIEW ==========
function showDetailView(person) {
    const container = document.getElementById('detailContainer');
    const initial = (person.NAME || '?').charAt(0).toUpperCase();
    
    container.innerHTML = `
        <div class="detail-card" id="detailCard">
            <div class="detail-header">
                <div class="detail-avatar">${initial}</div>
                <div class="detail-header-info">
                    <h2>${person.NAME || 'નામ નથી'}</h2>
                    <div class="badges">
                        <span class="badge badge-rank">${person.RANK || '-'}</span>
                        <span class="badge badge-id">બકલ નંબર: ${person.ID || '-'}</span>
                    </div>
                </div>
            </div>
            
            <div class="detail-grid" id="detailGrid">
                <div class="detail-field">
                    <div class="field-label">📏 ઊંચાઈ</div>
                    <div class="field-value">${person.HEIGHT || '-'} cm</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">⚖️ વજન</div>
                    <div class="field-value">${person.WEIGHT || '-'} kg</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🎂 જન્મ તારીખ</div>
                    <div class="field-value">${person.DOB || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">👞 કટ બૂટ</div>
                    <div class="field-value">${person.CUTBOOT || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🥾 હોલ બૂટ</div>
                    <div class="field-value">${person.HOLEBOOT || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">👟 પીટી શૂઝ</div>
                    <div class="field-value">${person.PTSHOE || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🌿 જંગલ શૂઝ</div>
                    <div class="field-value">${person.JUNGLESHOE || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">👕 ટી-શર્ટ</div>
                    <div class="field-value">${person.TSHIRT || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">👖 લોઅર સાઈઝ</div>
                    <div class="field-value">${person.LOWERSIZE || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🎖️ બેરેટ કેપ</div>
                    <div class="field-value">${person.BERET || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🧥 રેઈનકોટ</div>
                    <div class="field-value">${person.RAINCOAT || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🧥 ગરમ કોટ</div>
                    <div class="field-value">${person.WARMCOAT || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🧣 ગરમ જરશી</div>
                    <div class="field-value">${person.WARMJACKET || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🔫 ફાયરીંગ</div>
                    <div class="field-value">${person.FIRING || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🏥 મેડીકલ</div>
                    <div class="field-value">${person.MEDICAL || '-'}</div>
                </div>
                <div class="detail-field">
                    <div class="field-label">🩸 બ્લડ ગ્રુપ</div>
                    <div class="field-value">${person.BLOOD || '-'}</div>
                </div>
                <div class="detail-field full">
                    <div class="field-label">🪪 ચૂંટણી કાર્ડ નંબર</div>
                    <div class="field-value">${person.VOTERID || '-'}</div>
                </div>
            </div>
            
            <div class="detail-actions">
                <button class="btn-warning" onclick="showEditForm()">✏️ એડિટ કરો</button>
                <button class="btn-success" onclick="resetSearch()">✅ બંધ કરો</button>
            </div>
        </div>
    `;
}

// ========== SHOW EDIT FORM ==========
function showEditForm() {
    const person = peopleData.find(p => String(p.ID) === String(currentId));
    if (!person) return;
    
    const container = document.getElementById('detailContainer');
    const initial = (person.NAME || '?').charAt(0).toUpperCase();
    
    // ========== ઊંચાઈ ડ્રૉપડાઉન (160-185) ==========
    let heightOptions = '<option value="">-- પસંદ કરો --</option>';
    for (let i = 160; i <= 185; i++) {
        const selected = String(person.HEIGHT) === String(i) ? 'selected' : '';
        heightOptions += `<option value="${i}" ${selected}>${i}</option>`;
    }
    
    // ========== વજન ડ્રૉપડાઉન (45-120) ==========
    let weightOptions = '<option value="">-- પસંદ કરો --</option>';
    for (let i = 45; i <= 120; i++) {
        const selected = String(person.WEIGHT) === String(i) ? 'selected' : '';
        weightOptions += `<option value="${i}" ${selected}>${i}</option>`;
    }
    
    // ========== બૂટ સાઈઝ ડ્રૉપડાઉન (6-12) ==========
    function bootOptions(selectedValue) {
        let opts = '<option value="">-- પસંદ કરો --</option>';
        for (let i = 6; i <= 12; i++) {
            const selected = String(selectedValue) === String(i) ? 'selected' : '';
            opts += `<option value="${i}" ${selected}>${i}</option>`;
        }
        return opts;
    }
    
    // ========== બેરેટ કેપ ડ્રૉપડાઉન (6-10) ==========
    let beretOptions = '<option value="">-- પસંદ કરો --</option>';
    for (let i = 6; i <= 10; i++) {
        const selected = String(person.BERET) === String(i) ? 'selected' : '';
        beretOptions += `<option value="${i}" ${selected}>${i}</option>`;
    }
    
    // ========== કપડાં સાઈઝ ડ્રૉપડાઉન (M-XXL) ==========
    const clothSizes = ['M', 'L', 'XL', 'XXL'];
    function clothOptions(selectedValue) {
        let opts = '<option value="">-- પસંદ કરો --</option>';
        clothSizes.forEach(size => {
            const selected = String(selectedValue) === size ? 'selected' : '';
            opts += `<option value="${size}" ${selected}>${size}</option>`;
        });
        return opts;
    }
    
    // ========== બ્લડ ગ્રુપ ડ્રૉપડાઉન ==========
    const bloodGroups = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
    let bloodOptions = '<option value="">-- પસંદ કરો --</option>';
    bloodGroups.forEach(bg => {
        const selected = String(person.BLOOD) === bg ? 'selected' : '';
        bloodOptions += `<option value="${bg}" ${selected}>${bg}</option>`;
    });
    
    container.innerHTML = `
        <div class="detail-card">
            <div class="detail-header">
                <div class="detail-avatar">${initial}</div>
                <div class="detail-header-info">
                    <h2>✏️ એડિટ કરો</h2>
                    <div class="badges">
                        <span class="badge badge-id">બકલ નંબર: ${person.ID}</span>
                    </div>
                </div>
            </div>
            
            <div class="edit-form active">
                <div class="form-row">
                    <div class="form-group">
                        <label>👤 હોદ્દો</label>
                        <select id="editRank">
                            <option value="PI" ${person.RANK==='PI'?'selected':''}>PI</option>
                            <option value="PSI" ${person.RANK==='PSI'?'selected':''}>PSI</option>
                            <option value="ASI" ${person.RANK==='ASI'?'selected':''}>ASI</option>
                            <option value="APC" ${person.RANK==='APC'?'selected':''}>APC</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>👤 નામ</label>
                        <input type="text" id="editName" value="${person.NAME || ''}">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>📏 ઊંચાઈ (cm)</label>
                        <select id="editHeight">${heightOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>⚖️ વજન (kg)</label>
                        <select id="editWeight">${weightOptions}</select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>🎂 જન્મ તારીખ</label>
                    <input type="date" id="editDob" value="${person.DOB || ''}">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>👞 કટ બૂટ</label>
                        <select id="editCutBoot">${bootOptions(person.CUTBOOT)}</select>
                    </div>
                    <div class="form-group">
                        <label>🥾 હોલ બૂટ</label>
                        <select id="editHoleBoot">${bootOptions(person.HOLEBOOT)}</select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>👟 પીટી શૂઝ</label>
                        <select id="editPtShoe">${bootOptions(person.PTSHOE)}</select>
                    </div>
                    <div class="form-group">
                        <label>🌿 જંગલ શૂઝ</label>
                        <select id="editJungleShoe">${bootOptions(person.JUNGLESHOE)}</select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>👕 ટી-શર્ટ</label>
                        <select id="editTShirt">${clothOptions(person.TSHIRT)}</select>
                    </div>
                    <div class="form-group">
                        <label>👖 લોઅર સાઈઝ</label>
                        <select id="editLowerSize">${clothOptions(person.LOWERSIZE)}</select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>🎖️ બેરેટ કેપ</label>
                        <select id="editBeret">${beretOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>🧥 રેઈનકોટ</label>
                        <select id="editRaincoat">${clothOptions(person.RAINCOAT)}</select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>🧥 ગરમ કોટ</label>
                        <select id="editWarmCoat">${clothOptions(person.WARMCOAT)}</select>
                    </div>
                    <div class="form-group">
                        <label>🧣 ગરમ જરશી</label>
                        <select id="editWarmJacket">${clothOptions(person.WARMJACKET)}</select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>🔫 ફાયરીંગ</label>
                        <select id="editFiring">
                            <option value="હા" ${person.FIRING==='હા'?'selected':''}>હા</option>
                            <option value="ના" ${person.FIRING==='ના'?'selected':''}>ના</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏥 મેડીકલ</label>
                        <select id="editMedical">
                            <option value="હા" ${person.MEDICAL==='હા'?'selected':''}>હા</option>
                            <option value="ના" ${person.MEDICAL==='ના'?'selected':''}>ના</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>🩸 બ્લડ ગ્રુપ</label>
                        <select id="editBlood">${bloodOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>🪪 ચૂંટણી કાર્ડ</label>
                        <input type="text" id="editVoterId" value="${person.VOTERID || ''}">
                    </div>
                </div>
            </div>
            
            <div class="detail-actions">
                <button class="btn-success" onclick="saveData()">💾 સેવ કરો</button>
                <button class="btn-warning" onclick="showDetailView(peopleData.find(p => String(p.ID) === String(currentId)))">❌ રદ્દ કરો</button>
            </div>
        </div>
    `;
}
// ========== SAVE DATA ==========
async function saveData() {
    if (!currentId) return;
    
    const name = document.getElementById('editName').value.trim();
    if (!name) {
        showStatus('❌ કૃપા કરીને નામ ભરો!', 'error');
        return;
    }
    
    const updates = {
        RANK: document.getElementById('editRank').value,
        NAME: name,
        HEIGHT: document.getElementById('editHeight').value,
        WEIGHT: document.getElementById('editWeight').value,
        DOB: document.getElementById('editDob').value,
        CUTBOOT: document.getElementById('editCutBoot').value,
        HOLEBOOT: document.getElementById('editHoleBoot').value,
        PTSHOE: document.getElementById('editPtShoe').value,
        JUNGLESHOE: document.getElementById('editJungleShoe').value,
        TSHIRT: document.getElementById('editTShirt').value,
        LOWERSIZE: document.getElementById('editLowerSize').value,
        BERET: document.getElementById('editBeret').value,
        RAINCOAT: document.getElementById('editRaincoat').value,
        WARMCOAT: document.getElementById('editWarmCoat').value,
        WARMJACKET: document.getElementById('editWarmJacket').value,
        FIRING: document.getElementById('editFiring').value,
        MEDICAL: document.getElementById('editMedical').value,
        BLOOD: document.getElementById('editBlood').value,
        VOTERID: document.getElementById('editVoterId').value.trim()
    };
    
    showStatus('⏳ સેવ થઈ રહ્યું છે...', 'info');
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ id: currentId, updates: updates })
        });
        
        const result = await response.json();
        
        if (result.success) {
            const person = peopleData.find(p => String(p.ID) === String(currentId));
            if (person) Object.assign(person, updates);
            
            showStatus('✅ ડેટા સેવ થયો!', 'success');
            setTimeout(() => {
                showDetailView(person);
            }, 500);
        } else {
            showStatus('❌ સેવ કરવામાં ભૂલ: ' + (result.error || 'Unknown error'), 'error');
        }
    } catch (error) {
        showStatus('❌ નેટવર્ક ભૂલ: ' + error.message, 'error');
    }
}

// ========== RESET SEARCH ==========
function resetSearch() {
    document.getElementById('searchInput').value = '';
    currentId = null;
    hideStatus();
    showEmptyState('🔍', 'બકલ નંબર નાખો', 'ઉપર બોક્સમાં બકલ નંબર નાખીને શોધો બટન દબાવો');
    document.getElementById('searchInput').focus();
}

// ========== EMPTY STATE ==========
function showEmptyState(icon, title, message) {
    document.getElementById('detailContainer').innerHTML = `
        <div class="empty-state">
            <div class="icon">${icon}</div>
            <h3>${title}</h3>
            <p>${message}</p>
        </div>
    `;
}

// ========== STATUS ==========
function showStatus(msg, type) {
    const status = document.getElementById('statusMsg');
    status.textContent = msg;
    status.className = 'status ' + type;
}
function hideStatus() {
    document.getElementById('statusMsg').className = 'status';
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', async function() {
    await loadAllData();
});

// Enter કી
document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchPerson();
});
</script>
