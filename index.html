<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B કંપની</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.header{text-align:center;color:#fff;margin-bottom:30px}
.header h1{font-size:32px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
.search-section,.detail-card{max-width:700px;margin:0 auto 30px;background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.search-section label{display:block;font-weight:bold;font-size:18px;color:#2d3748;margin-bottom:10px}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-row input{flex:1;min-width:200px;padding:15px 20px;border:3px solid #667eea;border-radius:12px;font-size:18px;font-weight:bold;text-align:center}
.search-row input:focus{outline:none;border-color:#5a67d8;box-shadow:0 0 0 4px rgba(102,126,234,.2)}
button{border:none;border-radius:12px;font-weight:bold;cursor:pointer;transition:.3s;color:#fff}
button:disabled{opacity:.6;cursor:not-allowed}
button:focus-visible{outline:3px solid #2d3748;outline-offset:2px}
.search-row button{padding:15px 30px;font-size:18px}
.btn-primary{background:#667eea}.btn-primary:hover:not(:disabled){background:#5a67d8}
.btn-secondary{background:#718096}.btn-secondary:hover{background:#4a5568}
.btn-warning{background:#ed8936}.btn-warning:hover{background:#dd6b20}
.btn-success{background:#48bb78}.btn-success:hover:not(:disabled){background:#38a169}
.status,.save-status{display:none;text-align:center;padding:12px;border-radius:10px;margin-top:15px;font-size:15px;font-weight:bold}
.status.success,.save-status.success{display:block;background:#c6f6d5;color:#22543d}
.status.error,.save-status.error{display:block;background:#fed7d7;color:#742a2a}
.status.info,.save-status.info,.save-status.loading{display:block;background:#bee3f8;color:#2a69ac}
.save-status.loading{animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.6}}
#retryBtn{display:none;margin:10px auto 0;padding:10px 24px;background:#667eea;font-size:15px}
.detail-container{max-width:700px;margin:0 auto}
.detail-card{border-top:8px solid #667eea;animation:slideDown .4s ease;margin-bottom:0}
@keyframes slideDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.detail-card,.save-status{animation:none}}
.detail-header{display:flex;align-items:center;gap:20px;padding-bottom:20px;border-bottom:3px solid #f0f0f0;margin-bottom:25px}
.detail-avatar{width:80px;height:80px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:bold;flex-shrink:0}
.detail-header-info{flex:1}
.detail-header-info h2{font-size:24px;color:#2d3748;margin-bottom:8px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:bold;color:#fff}
.badge-rank{background:#667eea}.badge-id{background:#ed8936}
.detail-grid,.edit-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.edit-form{gap:15px}
.detail-field{background:#f7fafc;padding:14px;border-radius:12px;border-left:4px solid #667eea}
.field-label{font-size:12px;color:#718096;font-weight:bold;margin-bottom:4px}
.field-value{font-size:16px;color:#2d3748;font-weight:600;word-break:break-word}
.full{grid-column:1/-1}
.detail-actions{display:flex;gap:10px;margin-top:25px;padding-top:20px;border-top:2px solid #f0f0f0;flex-wrap:wrap}
.detail-actions button{flex:1;min-width:140px;padding:14px;font-size:16px}
.empty-state{text-align:center;color:#fff;padding:60px 20px}
.empty-state .icon{font-size:70px;margin-bottom:20px}
.empty-state h3{font-size:24px;margin-bottom:10px}
.empty-state p{font-size:16px;opacity:.9}
.edit-form label{display:block;font-weight:bold;color:#4a5568;margin-bottom:5px;font-size:14px}
.edit-form input,.edit-form select{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;background:#fff}
.edit-form input:focus,.edit-form select:focus{outline:none;border-color:#667eea}
@media (max-width:600px){
body{padding:10px}
.header h1{font-size:22px}
.search-section,.detail-card{padding:20px}
.search-section label{font-size:16px}
.search-row input{font-size:16px;padding:12px}
.search-row button{width:100%;font-size:16px;padding:12px}
.detail-header{flex-direction:column;text-align:center}
.badges{justify-content:center}
.detail-avatar{width:70px;height:70px;font-size:28px}
.detail-header-info h2{font-size:20px}
.detail-grid,.edit-form{grid-template-columns:1fr}
.field-value{font-size:15px}
}
</style>
</head>
<body>

<div class="header"><h1>B કંપની</h1></div>

<div class="search-section">
    <label for="searchInput">🔢 બકલ નંબર નાખો:</label>
    <div class="search-row">
        <input type="number" id="searchInput" placeholder="દા.ત. 1" autofocus>
        <button class="btn-primary" id="searchBtn" onclick="searchPerson()" disabled>🔍 શોધો</button>
        <button class="btn-secondary" onclick="resetSearch()">🔄 રીસેટ</button>
    </div>
    <div class="status" id="statusMsg" role="status"></div>
    <button id="retryBtn" onclick="loadAllData()">🔁 ફરી પ્રયાસ કરો</button>
</div>

<div class="detail-container" id="detailContainer"></div>

<script>
// ========== CONFIGURATION ==========
const API_URL = 'https://script.google.com/macros/s/AKfycbzeFIMhK-HxkrDu4reShpr8jEPJNG9hR_nQ0ZlvaNnPHDpZQOFs-dkK0LltRT5rnSt7uA/exec';
const TOKEN = ''; // જો Apps Script માં પાસવર્ડ/ટોકન ચેક ઉમેરો તો અહીં નાખો

let peopleData = [];
let currentId = null;
let loaded = false;

// ========== HELPERS ==========
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const same = (a, b) => {
    a = String(a ?? '').trim(); b = String(b ?? '').trim();
    return a === b || (a !== '' && b !== '' && !isNaN(a) && !isNaN(b) && Number(a) === Number(b));
};
const range = (a, b, s = 1) => { const r = []; for (let i = a; i <= b + 1e-9; i += s) r.push(String(i)); return r; };
const pad = n => String(n).padStart(2, '0');

function parseDate(v) {
    if (!v) return null;
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1], m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(+m[3], m[2] - 1, +m[1]);
    const d = new Date(s);            // ISO/UTC → લોકલ તારીખ (એક દિવસ પાછળની ભૂલ ટાળે છે)
    return isNaN(d) ? null : d;
}
function formatDate(v) {
    const d = parseDate(v);
    if (!d) return v ? esc(v) : '-';
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
}
function isoDate(v) {
    const d = parseDate(v);
    return d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) : '';
}

// ========== ફીલ્ડ યાદી ==========
const CLOTH = ['S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
const YN = ['હા', 'ના'];
const RANKS = ['PI', 'PSI', 'ASI', 'AHC', 'APC'];
const BLOOD = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
const BOOT = range(5, 13);
const FIELDS = [
    { k: 'HEIGHT', l: '📏 ઊંચાઈ', u: ' cm', o: range(150, 200) },
    { k: 'WEIGHT', l: '⚖️ વજન', u: ' kg', o: range(40, 150) },
    { k: 'DOB', l: '🎂 જન્મ તારીખ', t: 'date' },
    { k: 'CUTBOOT', l: '👞 કટ બૂટ સાઈઝ', o: BOOT },
    { k: 'HOLEBOOT', l: '🥾 હોલ બૂટ સાઈઝ', o: BOOT },
    { k: 'PTSHOE', l: '👟 પીટી શૂઝ સાઈઝ', o: BOOT },
    { k: 'JUNGLESHOE', l: '🌿 જંગલ શૂઝ સાઈઝ', o: BOOT },
    { k: 'TSHIRT', l: '👕 ટી-શર્ટ સાઈઝ', o: CLOTH },
    { k: 'LOWERSIZE', l: '👖 લોઅર સાઈઝ', o: CLOTH },
    { k: 'BERET', l: '🎖️ બેરેટ કેપ', o: range(5, 10, 0.5) },
    { k: 'RAINCOAT', l: '🧥 રેઈનકોટ સાઈઝ', o: CLOTH },
    { k: 'WARMCOAT', l: '🧥 ગરમ કોટ સાઈઝ', o: CLOTH },
    { k: 'WARMJACKET', l: '🧣 ગરમ જરશી સાઈઝ', o: CLOTH },
    { k: 'FIRING', l: '🔫 ફાયરીંગ થયું હા કે ના ?', o: YN },
    { k: 'MEDICAL', l: '🏥 મેડીકલ થયું હા કે ના ?', o: YN },
    { k: 'BLOOD', l: '🩸 બ્લડ ગ્રુપ', o: BLOOD },
    { k: 'VOTERID', l: '🪪 ચૂંટણી કાર્ડ નંબર', t: 'text', full: true }
];

// ========== API ==========
async function callAPI() {
    try {
        const url = API_URL + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
        const response = await fetch(url, { method: 'GET', mode: 'cors' });
        return await response.json();
    } catch (error) {
        console.error('API Error:', error);
        return { error: error.message };
    }
}

async function loadAllData() {
    loaded = false;
    $('searchBtn').disabled = true;
    $('retryBtn').style.display = 'none';
    showStatus('⏳ ડેટા લોડ થઈ રહ્યો છે...', 'info');
    const result = await callAPI();
    if (Array.isArray(result)) {
        peopleData = result;
        loaded = true;
        $('searchBtn').disabled = false;
        showStatus('✅ ' + peopleData.length + ' રેકોર્ડ્સ લોડ થયા', 'success');
        setTimeout(hideStatus, 2000);
    } else {
        showStatus('❌ ડેટા લોડ કરવામાં ભૂલ: ' + (result.error || 'Unknown error'), 'error');
        $('retryBtn').style.display = 'block';
    }
}

// ========== SEARCH ==========
function findPerson(id) { return peopleData.find(p => same(p.ID, id)); }

function searchPerson() {
    const query = $('searchInput').value.trim();
    if (!loaded) { showStatus('⏳ ડેટા હજી લોડ થાય છે, થોડી રાહ જુઓ', 'info'); return; }
    if (!query) { showStatus('❌ કૃપા કરીને બકલ નંબર નાખો!', 'error'); return; }
    const person = findPerson(query);
    if (!person) {
        showStatus('❌ બકલ નંબર ' + query + ' મળ્યો નહીં!', 'error');
        showEmptyState('❌', 'બકલ નંબર મળ્યો નહીં', 'બીજો બકલ નંબર ટ્રાય કરો');
        return;
    }
    currentId = person.ID;
    showStatus('✅ બકલ નંબર ' + query + ' નો ડેટા મળ્યો!', 'success');
    showDetailView(person);
}

// ========== DETAIL VIEW ==========
function headerHTML(person, title, showRank) {
    const initial = esc((person.NAME || '?').trim().charAt(0).toUpperCase());
    return `
    <div class="detail-header">
        <div class="detail-avatar">${initial}</div>
        <div class="detail-header-info">
            <h2>${title}</h2>
            <div class="badges">
                ${showRank ? `<span class="badge badge-rank">${esc(person.RANK || '-')}</span>` : ''}
                <span class="badge badge-id">બકલ નંબર: ${esc(person.ID || '-')}</span>
            </div>
        </div>
    </div>`;
}

function showDetailView(person) {
    if (!person) return;
    const grid = FIELDS.map(f => {
        const raw = person[f.k];
        const val = f.t === 'date' ? formatDate(raw) : (raw ? esc(raw) + (f.u || '') : '-');
        return `<div class="detail-field ${f.full ? 'full' : ''}">
            <div class="field-label">${f.l}</div>
            <div class="field-value">${val}</div>
        </div>`;
    }).join('');

    $('detailContainer').innerHTML = `
    <div class="detail-card">
        ${headerHTML(person, esc(person.NAME || 'નામ નથી'), true)}
        <div class="detail-grid">${grid}</div>
        <div class="detail-actions">
            <button class="btn-warning" onclick="showEditForm()">✏️ એડિટ કરો</button>
            <button class="btn-success" onclick="resetSearch()">✅ બંધ કરો</button>
        </div>
        <div id="saveStatus" class="save-status" role="status"></div>
    </div>`;
}

// ========== EDIT FORM ==========
// વર્તમાન કિંમત યાદીમાં ન હોય તો પણ ઉમેરાય છે, જેથી જૂનો ડેટા ભૂંસાય નહીં
function optionsHTML(opts, current) {
    const cur = String(current ?? '').trim();
    const list = cur && !opts.includes(cur) ? [...opts, cur] : opts;
    return '<option value="">-- પસંદ કરો --</option>' +
        list.map(o => `<option value="${esc(o)}" ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('');
}

function showEditForm() {
    const person = findPerson(currentId);
    if (!person) return;

    const fields = FIELDS.map(f => {
        let input;
        if (f.t === 'date') input = `<input type="date" id="f_${f.k}" value="${isoDate(person[f.k])}">`;
        else if (f.t === 'text') input = `<input type="text" id="f_${f.k}" value="${esc(person[f.k] ?? '')}">`;
        else input = `<select id="f_${f.k}">${optionsHTML(f.o, person[f.k])}</select>`;
        return `<div class="${f.full ? 'full' : ''}"><label for="f_${f.k}">${f.l}</label>${input}</div>`;
    }).join('');

    $('detailContainer').innerHTML = `
    <div class="detail-card">
        ${headerHTML(person, '✏️ એડિટ કરો', false)}
        <div class="edit-form">
            <div><label for="f_RANK">👤 હોદ્દો</label><select id="f_RANK">${optionsHTML(RANKS, person.RANK)}</select></div>
            <div><label for="f_NAME">👤 નામ</label><input type="text" id="f_NAME" value="${esc(person.NAME ?? '')}"></div>
            ${fields}
        </div>
        <div class="detail-actions">
            <button class="btn-success" id="saveBtn" onclick="saveData()">💾 સેવ કરો</button>
            <button class="btn-warning" onclick="showDetailView(findPerson(currentId))">❌ રદ્દ કરો</button>
        </div>
        <div id="saveStatus" class="save-status" role="status"></div>
    </div>`;
}

// ========== SAVE ==========
function collectChanges(person) {
    const changes = {};
    const keys = ['RANK', 'NAME', ...FIELDS.map(f => f.k)];
    keys.forEach(k => {
        const el = $('f_' + k);
        if (!el) return;
        const val = el.value.trim();
        const old = k === 'DOB' ? isoDate(person[k]) : person[k];
        if (!same(val, old)) changes[k] = val;
    });
    return changes;
}

async function saveData() {
    const person = findPerson(currentId);
    if (!person) return;

    if (!$('f_NAME').value.trim()) { showSaveStatus('❌ કૃપા કરીને નામ ભરો!', 'error'); return; }

    const updates = collectChanges(person);
    if (!Object.keys(updates).length) { showSaveStatus('ℹ️ કોઈ ફેરફાર કર્યો નથી', 'info'); return; }

    const saveBtn = $('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = '⏳ સેવ થઈ રહ્યું છે...';
    showSaveStatus('⏳ તમારી માહિતી સેવ થઈ રહી છે...', 'loading');

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ id: currentId, updates: updates, token: TOKEN })
        });
        const result = await response.json();

        if (result.success) {
            Object.assign(person, updates);
            showSaveStatus('✅ તમારી માહિતી સફળતાપૂર્વક સેવ થઈ ગઈ!', 'success');
            setTimeout(() => showDetailView(person), 1500);
        } else {
            throw new Error(result.error || 'Unknown error');
        }
    } catch (error) {
        showSaveStatus('❌ સેવ કરવામાં ભૂલ: ' + error.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 સેવ કરો';
    }
}

function showSaveStatus(msg, type) {
    const s = $('saveStatus');
    if (!s) return;
    s.textContent = msg;
    s.className = 'save-status ' + type;
}

// ========== RESET / EMPTY / STATUS ==========
function resetSearch() {
    $('searchInput').value = '';
    currentId = null;
    hideStatus();
    showEmptyState('🔍', 'બકલ નંબર નાખો', 'ઉપર બોક્સમાં બકલ નંબર નાખીને શોધો બટન દબાવો');
    $('searchInput').focus();
}

function showEmptyState(icon, title, message) {
    $('detailContainer').innerHTML = `
    <div class="empty-state">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${message}</p>
    </div>`;
}

function showStatus(msg, type) {
    const s = $('statusMsg');
    s.textContent = msg;
    s.className = 'status ' + type;
}
function hideStatus() { $('statusMsg').className = 'status'; }

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
    resetSearch();
    loadAllData();
});
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchPerson(); });
</script>
</body>
</html>
